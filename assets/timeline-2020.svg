<svg xmlns="http://www.w3.org/2000/svg" width="144" height="108" viewBox="0 0 144 108" role="img" aria-label="2020: Started B.Tech IT CSJMU Kanpur"><title>2020: Started B.Tech IT CSJMU Kanpur</title><style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.t{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.c{fill:#59636e;font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.v{fill:url(#vl);font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.y{fill:#1d4ed8;font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.e{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.ln{stroke:#d1d9e0}
.ring{fill:#ffffff}
.in{animation:up .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
.pulse{animation:pulse 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-color-scheme:dark){
  .bg{fill:#151b23;stroke:#3d444d}
  .t{fill:#f0f6fc}
  .c{fill:#9198a1}
  .v{fill:url(#vd)}
  .y{fill:#60a5fa}
  .ln{stroke:#3d444d}
  .ring{fill:#151b23}
}
@media (prefers-reduced-motion:reduce){.in,.pulse{animation:none}}
</style><defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<linearGradient id="vl" x1="0" x2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="vd" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
