<svg xmlns="http://www.w3.org/2000/svg" width="272" height="180" viewBox="0 0 272 180" role="img" aria-label="PDF Flipbook: Turns a PDF into a realistic page-turning book that loads instantly and works on mobile. (React, Vite, StPageFlip)"><title>PDF Flipbook: Turns a PDF into a realistic page-turning book that loads instantly and works on mobile. (React, Vite, StPageFlip)</title><style>.bg{fill:#fff;stroke:#d1d9e0}.c{fill:#59636e;font:400 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.t{fill:#1f2328;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.e{font:22px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.b{fill:#0969da;font-weight:700}.ch{fill:#ddf4ff}.ct{fill:#0969da;font:500 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.live{fill:#dafbe1}.livet{fill:#1a7f37}.star{fill:#fff8c5}.start{fill:#9a6700}@media (prefers-color-scheme:dark){.bg{fill:#151b23;stroke:#3d444d}.c{fill:#9198a1}.t{fill:#f0f6fc}.b{fill:#4493f8}.ch{fill:#172a45}.ct{fill:#58a6ff}.live{fill:#1a3324}.livet{fill:#3fb950}.star{fill:#2f2817}.start{fill:#d29922}}</style><defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".5" stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><clipPath id="r"><rect x="1" y="1" width="270" height="178" rx="12"/></clipPath></defs><rect class="bg" x="1" y="1" width="270" height="178" rx="12"/><rect x="1" y="1" width="270" height="3" fill="url(#bar)" clip-path="url(#r)"/><text class="e" x="18" y="41">📖</text><text class="t" x="50" y="38">PDF Flipbook</text><text class="c" x="18" y="64" xml:space="preserve">Turns a PDF into a realistic</text><text class="c" x="18" y="82" xml:space="preserve">page-turning book that loads instantly</text><text class="c" x="18" y="100" xml:space="preserve">and works on mobile.</text><rect class="ch" x="18"